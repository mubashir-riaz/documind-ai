name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Check FastAPI starts
        working-directory: backend
        env:
          GROQ_API_KEY: dummy_key_for_ci
        run: |
          uvicorn main:app &
          sleep 3
          curl -f http://localhost:8000/health
