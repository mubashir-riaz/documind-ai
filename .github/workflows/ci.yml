name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Check FastAPI starts
        working-directory: backend
        env:
          GROQ_API_KEY: dummy_key_for_ci
          CHROMADB_TELEMETRY: "off" # ← Cleaner logs
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 15 
          curl --retry 5 --retry-delay 2 --fail http://127.0.0.1:8000/health
